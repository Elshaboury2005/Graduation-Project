# spark-jobs/pyproject.toml
# --------------------------
# Tool configuration for the spark-jobs package.
# Run linting from the spark-jobs/ directory.

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "operations", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "ANN",  # annotation rules — not enforced on job scripts
    "N999", # module name rules (batch_processing_job, streaming_processing_job are valid)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow bare asserts in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "WARNING"
