# valid_sales_pipeline.yaml
# --------------------------
# A complete, valid pipeline configuration for a sales data processing workflow.
# This file is used in Phase 2 parser tests and as a reference example.

pipeline:
  name: sales-pipeline
  version: "1.0"

source:
  type: csv
  path: /data/raw/sales.csv

schema:
  - name: transaction_id
    type: string
  - name: amount
    type: double
  - name: customer_id
    type: string
  - name: product_id
    type: string
  - name: sale_date
    type: timestamp

processing:
  operations:
    - type: remove_nulls
    - type: remove_duplicates
    - type: filter
      condition: "amount > 0"
    - type: select_columns
      columns: ["transaction_id", "amount", "customer_id", "sale_date"]
    - type: rename_columns
      mapping:
        transaction_id: txn_id
        sale_date: date
    - type: type_conversion
      column: amount
      to_type: double
    - type: aggregate
      group_by: customer_id
      operation: sum
      field: amount

streaming:
  enabled: true

messaging:
  broker: kafka
  topic: sales-events
  partitions: 3
  replication_factor: 1

processing_engine:
  type: spark

storage:
  type: hdfs
  path: /data/processed/sales

monitoring:
  enabled: true
