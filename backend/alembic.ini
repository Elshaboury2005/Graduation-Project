# alembic.ini
# -----------
# Alembic configuration file.
#
# DATABASE_URL is NOT hard-coded here.  env.py reads it from the application's
# Settings object, which in turn reads it from the DATABASE_URL environment
# variable (or .env file).  This means alembic.ini never needs to be modified
# between environments.

[alembic]
# Path to the alembic migrations directory, relative to this file.
script_location = alembic

# Template for new migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path so that "app.*" imports work when running alembic CLI.
prepend_sys_path = .

# Timezone for revision timestamps.
timezone = UTC

# Maximum length of the slug portion in file names.
truncate_slug_length = 40

# Output encoding for migration scripts.
output_encoding = utf-8

[post_write_hooks]
# (intentionally empty — add black/ruff formatting hooks here if desired)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
